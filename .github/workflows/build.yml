name: Build Dylib

on: [push]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile .mm to .dylib
      run: |
        echo "Dang bien dich KeySystemHook.mm thanh dylib..."
        clang++ -dynamiclib -o KeySystemHook.dylib KeySystemHook.mm -framework Foundation -framework UIKit -stdlib=libc++
        echo "Bien dich thanh cong!"
        
    - name: Upload Compiled Dylib
      uses: actions/upload-artifact@v4
      with: 
        name: final-dylib
        path: KeySystemHook.dylib
